<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Archivio – Bildgalerie</title>
<style>
:root {
  --text:    #1f2937;
  --text-2:  #6b7280;
  --text-3:  #9ca3af;
  --border:  #e5e7eb;
  --bg:      #ffffff;
  --bg-2:    #f9fafb;
  --accent:  #111827;
  --radius:  6px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  overflow: hidden;
}

.demo-frame {
  position: relative;
  width: 680px;
  margin: 0 auto;
  padding: 24px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 10px 32px rgba(0,0,0,.08);
  overflow: hidden;
  opacity: 0;
}

/* ── Synthetischer Cursor ── */
.cursor {
  position: absolute; left: 0; top: 0; width: 22px; height: 22px;
  z-index: 90; pointer-events: none; will-change: transform;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.4));
  opacity: 0;
}
.cursor.cursor-b path { fill: #2563eb; }
.click-ring {
  position: absolute; left: 0; top: 0; width: 26px; height: 26px;
  margin-left: -8px; margin-top: -8px;
  border-radius: 50%; background: rgba(17,24,39,.18);
  z-index: 89; pointer-events: none; opacity: 0; will-change: transform, opacity;
}
.click-ring.ring-b { background: rgba(37,99,235,.2); }

.badge { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
.badge-pdf  { background: #fee2e2; color: #991b1b; }
.badge-eml  { background: #fef3c7; color: #92400e; }
.badge-xlsx { background: #dcfce7; color: #166534; }
mark { background: #fef9c3; color: var(--text); border-radius: 2px; padding: 0 1px; }

</style>
<style>
  .demo-frame { min-height: 420px; }
  .filter-bar { display: flex; align-items: center; gap: 10px; height: 40px; position: relative; z-index: 5; }

    font-size: 13px; font-weight: 600; padding: 7px 12px;

<script>
// Gemeinsame Timeline-Helfer für die bauchat.ch-Feature-Animationen (SVG/CSS/JS,
// kein Video). Jede Animation treibt ihre eigene requestAnimationFrame-Schleife;
// diese Datei stellt nur die Interpolations-Bausteine bereit.

function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function clamp01(x) { return Math.max(0, Math.min(1, x)); }
function fadeIn(t, start, dur) { return clamp01((t - start) / dur); }
function fadeOut(t, start, dur) { return 1 - fadeIn(t, start, dur); }

// Cursor, der sich entlang fester Wegpunkte {t,x,y} bewegt (ease-in-out zwischen
// je zwei Punkten) und an definierten Zeitpunkten einen Klick-Puls auslöst.
function makeCursor(cursorEl, ringEl, waypoints, clicks) {
  function posAt(t) {
    if (t <= waypoints[0].t) return waypoints[0];
    for (var i = 0; i < waypoints.length - 1; i++) {
      var a = waypoints[i], b = waypoints[i + 1];
      if (t >= a.t && t <= b.t) {
        var span = b.t - a.t;
        var f = span > 0 ? easeInOutCubic(clamp01((t - a.t) / span)) : 1;
        return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
      }
    }
    return waypoints[waypoints.length - 1];
  }
  return {
    render: function (t, visibleFrom, visibleTo) {
      var pos = posAt(t);
      var vis = fadeIn(t, visibleFrom, 0.2) * fadeOut(t, visibleTo, 0.3);
      cursorEl.style.opacity = vis;
      cursorEl.style.transform = 'translate(' + pos.x + 'px,' + pos.y + 'px)';
      var ringOpacity = 0, ringScale = 0.4, rx = 0, ry = 0;
      (clicks || []).forEach(function (c) {
        var dt = t - c.t;
        if (dt >= -0.02 && dt <= 0.4) {
          var f = clamp01(dt / 0.4);
          ringOpacity = 1 - f; ringScale = 0.4 + f * 1.3; rx = c.x; ry = c.y;
        }
      });
      ringEl.style.opacity = ringOpacity;
      ringEl.style.transform = 'translate(' + rx + 'px,' + ry + 'px) scale(' + ringScale + ')';
    }
  };
}

function loopPlayer(loopSeconds, renderFn) {
  var startTs = null;
  var SPEED = 0.8; // ca. 25% langsamer
  function tick(ts) {
    if (startTs === null) startTs = ts;
    var elapsed = ((ts - startTs) / 1000 * SPEED) % loopSeconds;
    renderFn(elapsed);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

</script>

  }

    ],

    cursor.render(t, 1.0, 10.5);

    grid.style.opacity = fadeIn(t, 0, 0.8);
    grid.style.transform = 'scale(' + (0.97 + fadeIn(t,0,0.8)*0.03) + ')';

    // Tile 4 (hellblau): Bewertung per Klick — ausführlich gezeigt
    stars4.style.opacity = fadeIn(t, 1.9, 0.15);

    // Tile 4: eigenen Tag vergeben — Kachel anklicken, tippen, mit Häkchen bestätigen
    tagAdd4.style.opacity = fadeIn(t, 1.0, 0.2) * fadeOut(t, 2.25, 0.15);
    tagPopover4.style.opacity = fadeIn(t, 2.25, 0.15) * fadeOut(t, 3.5, 0.15);
    var typeStart = 2.5;
    var charsShown = t >= typeStart ? Math.min(TAG_TEXT.length, Math.floor((t - typeStart) * 1000 / TAG_MS_PER_CHAR)) : 0;
    if (charsShown > 0) {
      tagInputText.textContent = TAG_TEXT.slice(0, charsShown);
      tagInputText.classList.remove('placeholder');
    } else {
      tagInputText.textContent = 'Tag eingeben…';
      tagInputText.classList.add('placeholder');
    }
    tagInputCaret.style.display = (t >= typeStart && t < 3.45) ? 'inline-block' : 'none';
    tagConfirm4.classList.toggle('active', charsShown > 0);
    document.getElementById('tag4').style.opacity = fadeIn(t, 3.5, 0.2);

    // Übrige bewertete/getaggte Kacheln: gleicher Ablauf kompakt, gestaffelt,
    // ohne jeden Zwischenschritt einzeln zu zeigen — bewusst über das ganze Grid verteilt.
    stars1.style.opacity  = fadeIn(t, 3.6,  0.2);
    stars3.style.opacity  = fadeIn(t, 3.75, 0.2);
    document.getElementById('tag3').style.opacity = fadeIn(t, 3.9, 0.2);
    stars6.style.opacity  = fadeIn(t, 4.05, 0.2);
    document.getElementById('tag6').style.opacity = fadeIn(t, 4.2, 0.2);
    stars9.style.opacity  = fadeIn(t, 4.35, 0.2);
    document.getElementById('tag9').style.opacity = fadeIn(t, 4.5, 0.2);
    stars7.style.opacity  = fadeIn(t, 4.65, 0.2);
    stars10.style.opacity = fadeIn(t, 4.8,  0.2);

    // Stern-Filter: Schwelle auf 3 setzen (erste 3 Sterne ausgefüllt)
    var starClickT = 4.95;
    for (var i = 1; i <= 4; i++){
      document.getElementById('sfs' + i).classList.toggle('filled', t >= starClickT && i <= 3);
    }
    // 1. Filterschritt: nur noch Kacheln mit ≥3★ sichtbar (t1, t3, t4, t6) — unterschiedliche Farben
    var keepAfterStars = {1:1, 3:1, 4:1, 6:1};
    var f1 = fadeIn(t, 5.1, 0.6);
    for (var i = 0; i <= 11; i++){
      if (keepAfterStars[i]) continue;
      var el = document.getElementById('t' + i);
      el.style.opacity = 1 - f1;
      el.style.transform = 'scale(' + (1 - f1*0.15) + ') translateY(' + (f1*8) + 'px)';
    }

    // Tag-Filter-Dropdown: öffnen, "Fassade" auswählen, schliessen
    var menuOpen = (t >= 6.05 && t < 6.45);
    tagFilterMenu.classList.toggle('open', menuOpen);
    tfiFassade.classList.toggle('hovered', t >= 6.3 && t < 6.45);
    tagFilter.classList.toggle('active', t >= 6.45);
    tagFilterLabel.textContent = (t >= 6.45) ? 'Fassade' : 'Alle Tags';

    // 2. Filterschritt: zusätzlich nach Tag "Fassade" — t1 hat den Tag nicht, fällt raus
    var f2 = fadeIn(t, 6.5, 0.5);
    var elT1 = document.getElementById('t1');
    elT1.style.opacity = 1 - f2;
    elT1.style.transform = 'scale(' + (1 - f2*0.15) + ') translateY(' + (f2*8) + 'px)';

    // Auswahl-Häkchen auf den 3 verbleibenden Treffern (t3, t4, t6)
    [3,4,6].forEach(function(i){ document.getElementById('check'+i).style.opacity = fadeIn(t,7.15,0.2); });

    // Aktions-Button: erst "Sichtbare wählen", danach "Kontaktbogen erstellen"
    btnSelect.style.opacity = fadeIn(t, 6.95, 0.15) * fadeOut(t, 7.5, 0.15);
    btnExport.style.opacity = fadeIn(t, 7.5, 0.15) * fadeOut(t, 9.2, 0.2);

    // Kontaktbogen-Vorschau (gelb/hellblau/rot passend zu t3/t4/t6)
    var csOpacity = fadeIn(t, 7.9, 0.3) * fadeOut(t, 10.4, 0.4);
    contactSheet.style.opacity = csOpacity;
    contactSheet.style.transform = 'translate(-50%,-50%) scale(' + (0.96 + fadeIn(t,7.9,0.3)*0.04) + ')';

    frame.style.opacity = fadeIn(t, 0, 0.25) * fadeOut(t, 10.4, 0.5);
  }

  loopPlayer(LOOP, render);
})();
</script>

</body>
</html>
