<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abmelden – Archivio</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #fff; color: #111; line-height: 1.6;
    }
    header {
      padding: 28px 48px; border-bottom: 1px solid #e8e8e8;
    }
    .wordmark {
      display: inline-flex; align-items: center; gap: 9px;
      font-size: 18px; font-weight: 600; letter-spacing: -0.3px; color: #111; text-decoration: none;
    }
    .page {
      max-width: 480px; margin: 0 auto; padding: 100px 24px;
      text-align: center;
    }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 16px; }
    p { color: #333; margin-bottom: 28px; }
    button {
      display: inline-block; background: #111; color: #fff;
      font-size: 15px; font-weight: 500; font-family: inherit;
      padding: 12px 28px; border-radius: 6px; border: none; cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #333; }
    button:disabled { background: #888; cursor: default; }
    footer {
      border-top: 1px solid #e8e8e8; padding: 32px 48px;
      text-align: center; font-size: 13px; color: #999;
    }
    footer a { color: #999; text-decoration: none; }
    footer a:hover { color: #111; }
  </style>
</head>
<body>

  <header>
    <a class="wordmark" href="index.html">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" stroke-width="2"/>
        <path d="m8 13 4-7 4 7" stroke-width="2"/>
        <path d="M9.1 11h5.7" stroke-width="2"/>
      </svg>
      Archivio
    </a>
  </header>

  <div class="page" id="content">
    <!-- wird per JS befüllt, je nachdem ob ein Token in der URL steht -->
  </div>

  <footer>
    <a href="mailto:info@bauchat.ch">info@bauchat.ch</a>
  </footer>

  <script>
    // Muss mit EMAIL_ENDPOINT_URL in index.html übereinstimmen.
    var EMAIL_ENDPOINT_URL = 'PASTE_APPS_SCRIPT_WEB_APP_URL_HERE';

    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    var content = document.getElementById('content');

    function renderInvalid() {
      content.innerHTML =
        '<h1>Kein gültiger Abmelde-Link</h1>' +
        '<p>Bitte nutzen Sie den Link aus Ihrer E-Mail.</p>';
    }

    function renderConfirm() {
      content.innerHTML =
        '<h1>Von Update-Benachrichtigungen abmelden?</h1>' +
        '<p>Möchten Sie sich von den Update-Benachrichtigungen abmelden?</p>' +
        '<button id="btn-unsub">Ja, abmelden</button>';
      document.getElementById('btn-unsub').addEventListener('click', doUnsubscribe);
    }

    function renderDone() {
      content.innerHTML =
        '<h1>Sie wurden abgemeldet.</h1>' +
        '<p>Ihre E-Mail-Adresse wird nicht mehr für Update-Benachrichtigungen verwendet.</p>';
    }

    function doUnsubscribe() {
      var btn = document.getElementById('btn-unsub');
      btn.disabled = true;
      btn.textContent = 'Wird bearbeitet…';

      if (EMAIL_ENDPOINT_URL.indexOf('PASTE_') !== -1) {
        renderDone();
        return;
      }

      fetch(EMAIL_ENDPOINT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'unsubscribe', token: token })
      })
        .catch(function () {})
        .then(renderDone);
    }

    if (!token) {
      renderInvalid();
    } else {
      renderConfirm();
    }
  </script>

</body>
</html>
