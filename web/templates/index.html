{% extends "base.html" %}
{% block title %}Archivio – Suche{% endblock %}

{% block content %}
<div id="search-form">

  <div class="search-wrap">
    <input class="search-input" id="q" name="q" type="search"
      placeholder="Dokumente und Mails durchsuchen…"
      autocomplete="off" autofocus
      hx-get="/search" hx-trigger="input changed delay:300ms, search"
      hx-target="#results" hx-include="#search-form" hx-indicator="#spinner">

    <label class="ai-toggle-wrap" title="Zwischen normaler Suche und KI-Suche wechseln">
      <span class="ai-toggle-label ai-toggle-left">Suche</span>
      <span class="ai-toggle-track">
        <input type="checkbox" id="ai-toggle" style="display:none"
          onchange="switchSearchMode(this.checked)">
        <span class="ai-toggle-thumb"></span>
      </span>
      <span class="ai-toggle-label ai-toggle-right">KI-Suche</span>
    </label>
  </div>

  {# ── Basis-Filter ── #}
  <div class="filters-basic">
    <select name="project_id"
      hx-get="/search" hx-trigger="change"
      hx-target="#results" hx-include="#search-form"
      onchange="updateChips()">
      <option value="">Alle Projekte</option>
      {% for p in projects %}
      <option value="{{ p.id }}">{{ p.name }}</option>
      {% endfor %}
    </select>

    <select name="type"
      hx-get="/search" hx-trigger="change"
      hx-target="#results" hx-include="#search-form"
      onchange="updateChips()">
      <option value="">Alle Typen</option>
      <option value="mail">✉ Mail</option>
      <optgroup label="Dokumente">
        <option value=".pdf">PDF</option>
        <option value=".docx">DOCX</option>
        <option value=".doc">DOC</option>
        <option value=".xlsx">XLSX</option>
        <option value=".txt">TXT</option>
        <option value=".rtf">RTF</option>
      </optgroup>
      <optgroup label="CAD / BIM">
        <option value=".dwg">DWG</option>
        <option value=".dxf">DXF</option>
        <option value=".pln">PLN (ArchiCAD)</option>
        <option value=".vwx">VWX (Vectorworks)</option>
        <option value=".ifc">IFC</option>
        <option value=".rvt">RVT (Revit)</option>
        <option value=".skp">SKP (SketchUp)</option>
        <option value=".3dm">3DM (Rhino)</option>
        <option value=".nwd">NWD (Navisworks)</option>
      </optgroup>
      <optgroup label="Medien">
        <option value=".psd">PSD</option>
        <option value=".ai">AI</option>
        <option value=".indd">INDD</option>
        <option value=".mp4">MP4</option>
        <option value=".mov">MOV</option>
        <option value=".zip">ZIP</option>
      </optgroup>
    </select>
  </div>

  {# ── Mehr Filter ── #}
  <button class="btn-mehr-filter" id="mehr-filter-btn" type="button"
    onclick="toggleMehrFilter()">⚙ Mehr Filter</button>

  <div id="mehr-filter-panel" class="mehr-filter-panel" style="display:none;">

    <div class="filter-section">
      <div class="filter-section-title">Mail-Filter</div>
      <div class="filter-row-2">
        <div>
          <label class="filter-label">Von (Absender)</label>
          <input type="text" name="from_addr" class="filter-input"
            placeholder="Absender-Adresse"
            hx-get="/search" hx-trigger="input changed delay:400ms"
            hx-target="#results" hx-include="#search-form"
            oninput="scheduleChipUpdate()">
        </div>
        <div>
          <label class="filter-label">An / CC (Empfänger)</label>
          <input type="text" name="to_addr" class="filter-input"
            placeholder="Empfänger-Adresse"
            hx-get="/search" hx-trigger="input changed delay:400ms"
            hx-target="#results" hx-include="#search-form"
            oninput="scheduleChipUpdate()">
        </div>
      </div>
      <div>
        <label class="filter-label">Betreff enthält</label>
        <input type="text" name="subject_filter" class="filter-input"
          placeholder="z.B. Baubeschrieb"
          hx-get="/search" hx-trigger="input changed delay:400ms"
          hx-target="#results" hx-include="#search-form"
          oninput="scheduleChipUpdate()">
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-section-title">Datei-Filter</div>
      <div class="filter-row-2">
        <div>
          <label class="filter-label">Datumsbereich</label>
          <div style="display:flex; gap:8px; align-items:center;">
            <input type="date" name="date_from" class="filter-input"
              hx-get="/search" hx-trigger="change"
              hx-target="#results" hx-include="#search-form"
              onchange="updateChips()">
            <span style="color:var(--text-3); font-size:12px; flex-shrink:0;">bis</span>
            <input type="date" name="date_to" class="filter-input"
              hx-get="/search" hx-trigger="change"
              hx-target="#results" hx-include="#search-form"
              onchange="updateChips()">
          </div>
        </div>
        <div>
          <label class="filter-label">Dateigrösse</label>
          <select name="filesize" class="filter-input"
            hx-get="/search" hx-trigger="change"
            hx-target="#results" hx-include="#search-form"
            onchange="updateChips()">
            <option value="">Beliebig</option>
            <option value="1">über 1 MB</option>
            <option value="10">über 10 MB</option>
            <option value="100">über 100 MB</option>
          </select>
        </div>
      </div>
      <div style="margin-top:4px;">
        <label class="filter-label">Nur Dubletten</label>
        <select name="duplicates_only" class="filter-input" style="width:auto;"
          hx-get="/search" hx-trigger="change"
          hx-target="#results" hx-include="#search-form"
          onchange="updateChips()">
          <option value="">Alle Dateien</option>
          <option value="1">Nur Dubletten</option>
        </select>
      </div>
    </div>

  </div>

  {# ── Aktive Filter als Chips ── #}
  <div id="active-chips"></div>

</div>

<div id="spinner" class="spinner htmx-indicator">Suche…</div>

<div id="results">
  <div class="empty-state">
    <p>Suchbegriff eingeben um Dokumente zu finden.</p>
  </div>
</div>

<script>
function toggleMehrFilter() {
  var panel = document.getElementById('mehr-filter-panel');
  var btn   = document.getElementById('mehr-filter-btn');
  var open  = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : 'block';
  btn.classList.toggle('active', !open);
}

var _chipTimer = null;
function scheduleChipUpdate() {
  clearTimeout(_chipTimer);
  _chipTimer = setTimeout(updateChips, 420);
}

function updateChips() {
  var container = document.getElementById('active-chips');
  container.innerHTML = '';
  var defs = [
    { name: 'project_id', label: function(v) {
        var o = document.querySelector('select[name=project_id] option[value="'+v+'"]');
        return o ? o.text : v;
    }},
    { name: 'type', label: function(v) {
        var o = document.querySelector('select[name=type] option[value="'+v+'"]');
        return o ? o.text : v;
    }},
    { name: 'from_addr',       label: function(v) { return 'Von: '+v; } },
    { name: 'to_addr',         label: function(v) { return 'An/CC: '+v; } },
    { name: 'subject_filter',  label: function(v) { return 'Betreff: '+v; } },
    { name: 'date_from',       label: function(v) { return 'Ab: '+fmtDate(v); } },
    { name: 'date_to',         label: function(v) { return 'Bis: '+fmtDate(v); } },
    { name: 'filesize',        label: function(v) {
        var o = document.querySelector('select[name=filesize] option[value="'+v+'"]');
        return o ? o.text : v;
    }},
    { name: 'duplicates_only', label: function() { return 'Nur Dubletten'; } },
  ];
  defs.forEach(function(def) {
    var el = document.querySelector('[name="'+def.name+'"]');
    if (!el || !el.value) return;
    var chip = document.createElement('span');
    chip.className = 'filter-chip';
    var n = def.name;
    chip.innerHTML = def.label(el.value)
      + ' <button onclick="clearFilter(\''+n+'\')">×</button>';
    container.appendChild(chip);
  });
}

function clearFilter(name) {
  var el = document.querySelector('[name="'+name+'"]');
  if (!el) return;
  el.value = '';
  updateChips();
  htmx.trigger(document.getElementById('q'), 'search');
}

function fmtDate(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  return p[2]+'.'+p[1]+'.'+p[0];
}

function togglePreview(btn, docId, q) {
  var box = document.getElementById('preview-'+docId);
  if (!box) return;
  if (box.style.display !== 'none') {
    box.style.display = 'none';
    btn.textContent = '▶';
  } else {
    box.style.display = 'block';
    btn.textContent = '▼';
    if (!btn.dataset.loaded) {
      btn.dataset.loaded = '1';
      htmx.ajax('GET', '/preview/'+docId+'?q='+encodeURIComponent(q),
        { target: '#preview-'+docId, swap: 'innerHTML' });
    }
  }
}

var _aiTimer = null;
var _aiStep  = 0;
var AI_STEPS = [
  'Durchsucht Dokumente…',
  'Analysiert relevante Abschnitte…',
  'Generiert Antwort…',
];

function _renderAiLoading() {
  var html = '<div class="ai-thinking">';
  AI_STEPS.forEach(function(label, i) {
    var cls = i < _aiStep ? 'done' : (i === _aiStep ? 'active' : '');
    html += '<div class="ai-thinking-step ' + cls + '">'
          + '<span class="ai-thinking-dot"></span>'
          + '<span>' + label + '</span></div>';
  });
  html += '</div>';
  document.getElementById('results').innerHTML = html;
}

function _showAiLoading() {
  _aiStep = 0;
  _renderAiLoading();
  clearInterval(_aiTimer);
  _aiTimer = setInterval(function() {
    if (_aiStep < AI_STEPS.length - 1) { _aiStep++; _renderAiLoading(); }
  }, 4000);
}

function _clearAiLoading() {
  clearInterval(_aiTimer);
  _aiTimer = null;
}

document.body.addEventListener('htmx:beforeRequest', function(evt) {
  if (evt.detail.elt.id !== 'q') return;
  if (!document.getElementById('ai-toggle').checked) return;
  _showAiLoading();
});
document.body.addEventListener('htmx:afterRequest', function(evt) {
  if (evt.detail.elt.id !== 'q') return;
  _clearAiLoading();
});

function switchSearchMode(aiOn) {
  var input  = document.getElementById('q');
  var wrap   = document.querySelector('.ai-toggle-wrap');
  var thumb  = document.querySelector('.ai-toggle-thumb');
  if (aiOn) {
    wrap.classList.add('ai-on');
    input.setAttribute('hx-get', '/search/ai');
    input.setAttribute('hx-trigger', 'search');
    input.placeholder = 'Frage stellen und Enter drücken…';
  } else {
    wrap.classList.remove('ai-on');
    input.setAttribute('hx-get', '/search');
    input.setAttribute('hx-trigger', 'input changed delay:300ms, search');
    input.placeholder = 'Dokumente und Mails durchsuchen…';
  }
  htmx.process(input);
  // Ergebnisse leeren beim Wechsel
  document.getElementById('results').innerHTML = '';
}

function copyPath(btn, text) {
  navigator.clipboard.writeText(text).then(function() {
    var orig = btn.textContent;
    btn.textContent = 'Kopiert ✓';
    setTimeout(function() { btn.textContent = orig; }, 1500);
  });
}
</script>
{% endblock %}
