<div id="stats-bar" class="stats-bar"
     hx-get="/dashboard/stats"
     hx-trigger="archivio:scanComplete from:body"
     hx-swap="outerHTML"
     style="display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;">
  <div style="display:flex; gap:32px;">
    <div class="stat">
      <span class="stat-n">{{ stats.total }}</span>
      <span class="stat-l">Dokumente</span>
    </div>
    <div class="stat">
      <span class="stat-n">{{ stats.active_projects }}</span>
      <span class="stat-l">Aktive Projekte</span>
    </div>
    <div class="stat">
      <span class="stat-n">{{ stats.last_scan }}</span>
      <span class="stat-l">Letzter Scan</span>
    </div>
  </div>
  <div style="display:flex; gap:8px;">
    <button type="button" class="btn btn-sm" onclick="toggleTopPanel('project-folders-panel', this)">+ Neuer Projektordner</button>
    <button type="button" class="btn btn-sm" onclick="toggleTopPanel('mail-accounts-panel', this)">+ Neues Mail-Konto</button>
  </div>
</div>
