<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kontaktbogen — Archivio</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; color: #1f2937; }
  .kb-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 16px; flex-wrap: wrap; }
  .kb-header h1 { font-size: 16px; font-weight: 600; }
  .kb-actions { display: flex; align-items: center; gap: 10px; }
  .kb-mode-toggle { display: inline-flex; border: 1px solid #d1d5db; border-radius: 6px; overflow: hidden; }
  .kb-mode-btn {
    background: #fff; color: #374151; border: none; padding: 7px 14px; font-size: 12px;
    font-family: inherit; cursor: pointer;
  }
  .kb-mode-btn + .kb-mode-btn { border-left: 1px solid #d1d5db; }
  .kb-mode-btn.active { background: #111827; color: #fff; }
  .kb-print-btn {
    background: #111827; color: #fff; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .kb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .kb-item { break-inside: avoid; }
  .kb-item img {
    width: 100%; border-radius: 4px; display: block; background: #f3f4f6;
  }
  body.kb-square .kb-item img { aspect-ratio: 1 / 1; object-fit: cover; }
  body.kb-original .kb-item img { aspect-ratio: auto; height: auto; object-fit: contain; }
  .kb-caption { font-size: 11px; color: #4b5563; margin-top: 5px; word-break: break-all; }
  .kb-stars { font-size: 11px; color: #d97706; }
  .kb-empty { color: #9ca3af; font-size: 14px; }
  .kb-filename-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #374151; cursor: pointer; }
  body.kb-hide-filenames .kb-filename { display: none; }

  @media print {
    body { margin: 8mm; }
    .kb-print-btn, .kb-mode-toggle, .kb-filename-toggle { display: none; }
    .kb-header { margin-bottom: 10mm; }
  }
</style>
</head>
<body class="kb-square">
  <div class="kb-header">
    <h1>Kontaktbogen — {{ photos|length }} Foto{{ 's' if photos|length != 1 else '' }}</h1>
    <div class="kb-actions">
      <div class="kb-mode-toggle">
        <button type="button" class="kb-mode-btn active" data-mode="square" onclick="setKbMode('square')">Quadratisch</button>
        <button type="button" class="kb-mode-btn" data-mode="original" onclick="setKbMode('original')">Original</button>
      </div>
      <label class="kb-filename-toggle">
        <input type="checkbox" id="kb-show-filenames" checked onchange="toggleKbFilenames()">
        Dateinamen einblenden
      </label>
      <button class="kb-print-btn" onclick="window.print()">Als PDF drucken</button>
    </div>
  </div>
  {% if photos %}
  <div class="kb-grid">
    {% for p in photos %}
    <div class="kb-item">
      <img src="/foto/{{ p.id }}/ansicht" alt="{{ p.filename }}">
      <div class="kb-caption">
        <span class="kb-filename">{{ p.filename }}</span>
        {% if p.rating %}<div class="kb-stars">{{ '★' * p.rating }}{{ '☆' * (5 - p.rating) }}</div>{% endif %}
      </div>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <p class="kb-empty">Keine Fotos ausgewählt.</p>
  {% endif %}

  <script>
    function setKbMode(mode) {
      document.body.classList.remove('kb-square', 'kb-original');
      document.body.classList.add('kb-' + mode);
      document.querySelectorAll('.kb-mode-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
    }

    function toggleKbFilenames() {
      document.body.classList.toggle('kb-hide-filenames', !document.getElementById('kb-show-filenames').checked);
    }
  </script>
</body>
</html>
