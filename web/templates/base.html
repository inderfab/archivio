<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Archivio{% if office_name() %} – {{ office_name() }}{% endif %}{% endblock %}</title>
  <script src="/static/htmx.min.js" defer></script>
  <style>
    /* ── Reset & Basis ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text:    #1f2937;
      --text-2:  #6b7280;
      --text-3:  #9ca3af;
      --border:  #e5e7eb;
      --bg:      #ffffff;
      --bg-2:    #f9fafb;
      --accent:  #111827;
      --radius:  6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }

    /* ── Layout ── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0;
    }
    .header-inner {
      display: flex;
      align-items: center;
      gap: 32px;
      height: 52px;
    }
    .logo-wrap { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo-icon  { width: 18px; height: 18px; display: block; opacity: .7; }
    .logo-text  { font-size: 15px; font-weight: 600; color: var(--text-2); letter-spacing: -0.01em; }

    nav {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
    }
    nav a {
      font-size: 13px;
      color: var(--text-2);
      text-decoration: none;
      padding: 5px 10px;
      border-radius: var(--radius);
    }
    nav a:hover { color: var(--text); background: var(--bg-2); }
    nav a.active { color: var(--text); font-weight: 600; background: var(--bg-2); }
    .version-badge { font-size: 12px; color: var(--text-3); margin-left: 8px; }
    .nav-scan-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 500;
      background: #fef3c7; color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 99px; padding: 2px 8px; margin-left: 6px;
      animation: scan-pulse 1.5s ease-in-out infinite;
    }
    @keyframes scan-pulse { 0%,100% { opacity:1 } 50% { opacity:.6 } }

    /* ── Suchfeld ── */
    .search-wrap { padding: 16px 0 8px; position: relative; }

    /* ── Volltext/KI-Suche-Toggle -- gleiche Pillenform wie Suche/Fotos (.mode-switch),
       nur kleiner, optisch im Suchbalken integriert (absolut positioniert am rechten
       Rand) statt als eigene Zeile darunter. ── */
    .ai-toggle-wrap {
      /* .search-wrap hat oben/unten ungleiches Padding (16px/8px) fuer den Abstand
         zu Nachbarzeilen -- 50% relativ zum Wrap waere daher 4px zu tief. */
      position: absolute; right: 8px; top: calc(50% + 4px); transform: translateY(-50%);
      display: inline-flex; padding: 2px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--bg-2);
    }
    .ai-toggle-btn {
      font-size: 12px; font-weight: 600; font-family: inherit;
      padding: 5px 12px; border: none; border-radius: 999px;
      background: none; color: var(--text-2); cursor: pointer; white-space: nowrap;
    }
    .ai-toggle-btn:hover { color: var(--text); }
    .ai-toggle-btn.active { color: #fff; background: #111; }

    /* ── KI-Antwort ── */
    .ai-answer-block {
      background: #f0f9ff; border: 1px solid #bae6fd;
      border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px;
    }
    .ai-answer-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .ai-label {
      font-size: 12px; font-weight: 600; letter-spacing: .04em;
      text-transform: uppercase; color: #0369a1;
    }
    .ai-model { font-size: 12px; color: #64748b; }
    .ai-answer-text { font-size: 14px; line-height: 1.7; color: var(--text); white-space: pre-wrap; }
    .ai-answer-sources {
      margin-top: 14px; padding-top: 12px;
      border-top: 1px solid #bae6fd;
    }
    .ai-answer-sources-label {
      font-size: 12px; font-weight: 600; color: #0369a1;
      text-transform: uppercase; letter-spacing: .04em;
      display: block; margin-bottom: 6px;
    }
    .ai-answer-source-row {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .ai-answer-source-name {
      font-size: 13px; font-weight: 500; color: var(--text);
    }
    .ai-error {
      background: #fff7ed; border: 1px solid #fed7aa;
      border-radius: var(--radius); padding: 12px 16px;
      font-size: 13px; color: #92400e; margin-bottom: 12px;
    }
    .ai-error-icon { margin-right: 6px; }
    .ai-error-ollama {
      background: #fef3f2; border-color: #fecaca;
      color: #7f1d1d; padding: 16px 20px;
    }
    .ai-error-title { font-weight: 600; margin-bottom: 6px; }
    .ai-error-body  { margin-bottom: 12px; line-height: 1.5; }
    .btn-ollama-install {
      display: inline-block; background: #1d4ed8; color: #fff;
      padding: 7px 16px; border-radius: var(--radius);
      font-size: 13px; font-weight: 500; text-decoration: none;
    }
    .btn-ollama-install:hover { background: #1e40af; }
    .ai-score {
      margin-left: auto; font-size: 12px; color: var(--text-3);
      background: var(--bg-2); padding: 1px 6px; border-radius: 10px;
    }

    /* ── KI-Ladeanimation ── */
    .ai-thinking {
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ai-thinking-step {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-3);
      transition: color 0.4s;
    }
    .ai-thinking-step.active { color: var(--text); }
    .ai-thinking-step.done   { color: var(--text-3); text-decoration: line-through; }
    .ai-thinking-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: currentColor; flex-shrink: 0;
    }
    .ai-thinking-step.active .ai-thinking-dot {
      background: #2563eb;
      animation: ai-dot-pulse 1.1s ease-in-out infinite;
    }
    .ai-thinking-step.done .ai-thinking-dot { background: var(--text-3); }
    @keyframes ai-dot-pulse {
      0%, 100% { opacity: .35; transform: scale(.7); }
      50%       { opacity: 1;   transform: scale(1.4); }
    }
    .search-input {
      width: 100%;
      padding: 14px 160px 14px 18px;
      font-size: 17px;
      font-family: inherit;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      color: var(--text);
      background: var(--bg);
      transition: border-color .15s, box-shadow .15s;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(17,24,39,.08);
    }
    .search-input::placeholder { color: var(--text-3); }
    #gallery-q { padding-right: 18px; }  /* kein KI-Toggle in Fotos, kein reservierter Platz noetig */

    /* ── Basis-Filter ── */
    .filters-basic {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 0 8px;
    }
    select, .filter-select {
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      outline: none;
      width: 100%;
    }
    select:hover { border-color: #9ca3af; }

    /* ── Suche-Scope ── */
    .search-scope-row {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 8px; padding: 6px 0 10px;
    }
    .search-scope-row .type-select { width: auto; max-width: 200px; flex-shrink: 0; font-weight: 600; }
    .search-scope-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 0 1 auto; }
    .search-scope-label {
      font-size: 12px; color: var(--text-3); flex-shrink: 0;
      display: inline-block; min-width: 4.5rem;
    }
    .scope-btn {
      font-size: 13px; font-family: inherit;
      padding: 5px 12px; white-space: nowrap;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text-2); cursor: pointer;
    }
    .scope-btn:hover { border-color: #9ca3af; }
    .scope-btn.active {
      background: #111; color: #fff;
      font-weight: 600; border-color: #111;
    }
    /* Reset-Buttons neben einem Eingabefeld (Alle Ordner/Alle Tags) -- bleiben
       optisch ruhig statt schwarz gefuellt, auch wenn sie der aktuelle Zustand sind. */
    .scope-btn-quiet.active {
      background: var(--bg-2); color: var(--text); border-color: #9ca3af;
    }

    /* ── Segmented Control (Ergebnis-Umfang: Alle / Nur Pläne / Nur Normen) ──
       Gemeinsamer Aussenrahmen + Haarlinien zwischen den Segmenten, damit als
       Gruppe mit Einfachauswahl erkennbar -- nicht wie einzelne Beschriftungen. ── */
    .scope-divider { width: 1px; align-self: stretch; background: var(--border); margin: 0 16px; flex-shrink: 0; }
    .segmented-control {
      display: inline-flex; flex-shrink: 0;
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; background: var(--bg);
    }
    .segmented-btn {
      font-size: 13px; font-family: inherit; white-space: nowrap;
      padding: 5px 12px; min-width: 108px; text-align: center;
      border: 0; border-left: 1px solid var(--border);
      background: transparent; color: var(--text-2); cursor: pointer;
    }
    .segmented-btn:first-child { border-left: 0; }
    .segmented-btn:hover { color: var(--text); }
    .segmented-btn.active {
      background: #111; color: #fff; font-weight: 600;
    }
    .segmented-btn:focus-visible { outline: 2px solid var(--accent, #2563eb); outline-offset: 1px; }
    .search-scope-row > .btn-mehr-filter { margin-left: auto; }

    /* ── Mehr-Filter ── */
    .btn-mehr-filter {
      font-size: 14px; font-weight: 600; font-family: inherit;
      padding: 9px 16px; flex-shrink: 0;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text); cursor: pointer; white-space: nowrap;
    }
    .btn-mehr-filter:hover { background: var(--bg-2); }
    .btn-mehr-filter.active { background: var(--bg-2); color: var(--text); border-color: #9ca3af; }
    .mehr-filter-panel {
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 10px; background: var(--bg-2);
    }
    .filter-section { margin-bottom: 16px; }
    .filter-section:last-child { margin-bottom: 0; }
    .filter-section-title {
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-3); margin-bottom: 10px;
    }
    .filter-row-2 {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 10px;
    }
    .filter-label {
      display: block; font-size: 10px; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 5px;
    }
    .filter-input {
      width: 100%; padding: 7px 10px; font-size: 13px; font-family: inherit;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text); outline: none;
    }
    .filter-input:focus { border-color: #9ca3af; }

    /* ── Feld mit eingebettetem Präfix statt gestapeltem Label (siehe
       archivio-suchfilter-ui.md §4.1) — der Platzhalter verschwindet beim Tippen,
       das Präfix bleibt stehen und identifiziert das Feld weiterhin. ── */
    .field-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field-grid-2.gap-top, .field.gap-top { margin-top: 14px; }
    .field {
      display: flex; align-items: stretch;
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; background: var(--bg);
    }
    .field:focus-within { border-color: #9ca3af; }
    .field-prefix {
      flex: 0 0 auto; min-width: 4.5rem; padding: 7px 10px;
      color: var(--text-3); background: var(--bg-2);
      border-right: 1px solid var(--border); font-size: 12px;
      display: flex; align-items: center; user-select: none; white-space: nowrap;
    }
    .field input {
      flex: 1 1 auto; border: 0; outline: none; background: transparent;
      padding: 7px 10px; min-width: 0; font-size: 13px; font-family: inherit; color: var(--text);
    }
    /* Datumsfelder brauchen Platz fuer "tt.mm.jjjj" + Kalender-Icon -- ohne feste
       Mindestbreite schneidet der Flex-Container das Jahr ab. */
    .field input[type="date"] { min-width: 150px; flex: 1 1 150px; }
    .field-date-sep {
      color: var(--text-3); font-size: 12px; padding: 0 8px; flex-shrink: 0;
      align-self: stretch; display: flex; align-items: center;
      border-left: 1px solid var(--border);
    }
    .cell-inline { display: flex; gap: 8px; align-items: center; }
    .cell-inline .field { flex: 1 1 auto; min-width: 0; }
    .cell-inline .scope-btn-quiet { margin-left: auto; }
    .sort-arrow { margin-left: 3px; color: var(--text-3); }
    .sort-field-btn.active .sort-arrow { color: #fff; }
    .missed-scan-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
      padding: 10px 14px; border-radius: var(--radius); font-size: 13px;
      margin: 16px 0 0; line-height: 1.5;
    }
    .missed-scan-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .missed-scan-close {
      background: none; border: none; color: #92400e; font-size: 16px;
      cursor: pointer; line-height: 1; padding: 0 4px;
    }
    .gallery-key-hint {
      font-size: 12px; color: var(--text-3); padding: 6px 2px 10px; text-align: left;
    }
    .gallery-key-hint kbd {
      border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; font-family: inherit;
    }
    /* Kompakter Tipp innerhalb eines Eingabefelds -- verschwindet bei Fokus/Eingabe,
       damit er nicht mit dem getippten Text kollidiert. */
    .field-inline-hint {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font-size: 12px; color: var(--text-3); pointer-events: none; white-space: nowrap;
    }
    .field-inline-hint kbd {
      border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; font-family: inherit;
    }

    /* ── Sterne als SVG (currentColor statt Emoji, siehe B1/B2) ──
       Ein <path>, Fuellung/Kontur je nach .filled-Modifier -- Umriss fuer leer,
       gefuellt fuer gesetzt. Ueber Fotos weiss mit Schatten, sonst Textfarbe geerbt. ── */
    .star { width: 1.15em; height: 1.15em; vertical-align: -.2em; fill: none; stroke: currentColor; stroke-width: 1.6; opacity: .45; }
    .filled .star, .star.filled { fill: currentColor; stroke: none; opacity: 1; }
    .scope-divider-sm { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
    .star-rating-filter { display: inline-flex; gap: 1px; }
    .star-filter-btn {
      border: 0; background: transparent; padding: 4px 2px; cursor: pointer;
      color: var(--text-3); line-height: 0;
    }
    .star-filter-btn:focus-visible { outline: 2px solid var(--accent, #2563eb); outline-offset: 1px; border-radius: 3px; }
    .star-filter-btn.filled { color: #d97706; }
    /* Kachel-/Vollbild-Overlay: weiss mit Schatten, damit auf hellen wie dunklen Fotos lesbar */
    .photo-stars .star, .loupe-stars .star { color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
    @media (max-width: 900px) {
      .field-grid-2 { grid-template-columns: 1fr; }
    }

    /* ── Filter-Chips ── */
    #active-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 0 12px; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px 3px 10px;
      background: #eff6ff; color: #1d4ed8;
      border: 1px solid #bfdbfe; border-radius: 100px; font-size: 12px;
    }
    .filter-chip button {
      background: none; border: none; cursor: pointer;
      color: #1d4ed8; font-size: 14px; line-height: 1; padding: 0;
    }

    /* ── Resultate ── */
    #results { min-height: 120px; }

    .result-count {
      font-size: 13px;
      color: var(--text-3);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .result {
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }
    .result:last-child { border-bottom: none; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .result-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }
    .result-title:hover { text-decoration: underline; color: #374151; }

    /* ── Badges ── */
    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .badge-pdf  { background: #fee2e2; color: #991b1b; }
    .badge-doc,
    .badge-docx { background: #dbeafe; color: #1e40af; }
    .badge-xlsx { background: #dcfce7; color: #166534; }
    .badge-eml  { background: #fef3c7; color: #92400e; }
    .badge-txt,
    .badge-rtf  { background: #f3f4f6; color: #374151; }
    /* CAD / BIM */
    .badge-dwg,
    .badge-dxf  { background: #ede9fe; color: #5b21b6; }
    .badge-pln  { background: #e0e7ff; color: #3730a3; }
    .badge-vwx  { background: #e0e7ff; color: #3730a3; }
    .badge-ifc  { background: #d1fae5; color: #065f46; }
    .badge-rvt  { background: #fce7f3; color: #9d174d; }
    .badge-skp,
    .badge-3dm,
    .badge-nwd  { background: #f3f4f6; color: #374151; }
    /* Medien / Sonstiges */
    .badge-psd,
    .badge-ai,
    .badge-indd { background: #fef3c7; color: #78350f; }
    .badge-mp4,
    .badge-mov  { background: #f3f4f6; color: #6b7280; }
    .badge-zip  { background: #f3f4f6; color: #6b7280; }
    .badge-page { background: #e0f2fe; color: #075985; font-variant-numeric: tabular-nums; }
    .badge-norm { background: #fef2f2; color: #991b1b; text-transform: none; letter-spacing: 0; }

    .no-content-hint {
      font-size: 12px;
      color: var(--text-3);
      font-style: italic;
    }

    /* ── Meta & Pfad ── */
    .result-meta {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 5px;
    }
    .result-path {
      font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 7px;
      word-break: break-all;
    }

    /* ── Textausschnitt ── */
    .result-excerpt {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.55;
    }
    mark {
      background: #fef9c3;
      color: var(--text);
      border-radius: 2px;
      padding: 0 1px;
    }

    /* ── Leer-Zustand ── */
    .empty-state {
      padding: 72px 0;
      text-align: center;
      color: var(--text-3);
    }
    .empty-state p { font-size: 14px; }

    /* ── HTMX Indicator ── */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .spinner {
      font-size: 13px;
      color: var(--text-3);
      padding: 24px 0;
      display: none;
    }

    /* ── Dashboard ── */
    .stats-bar {
      display: flex;
      gap: 40px;
      padding: 28px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .stat-n { display: block; font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1.1; }
    .stat-l { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px; }

    .problem-docs { border: 1px solid var(--border); border-radius: var(--radius); }
    .problem-docs-summary {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; cursor: pointer; user-select: none;
      font-size: 12px; font-weight: 600; color: var(--text-2);
      text-transform: uppercase; letter-spacing: .05em;
      list-style: none;
    }
    .problem-docs-summary::-webkit-details-marker { display: none; }
    .problem-docs-summary::before { content: '▶'; font-size: 10px; transition: transform .15s; }
    details[open] .problem-docs-summary::before { transform: rotate(90deg); }
    .problem-docs-badge {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 1px 7px;
      font-size: 12px; font-weight: 700; color: var(--text-3);
    }
    .problem-docs-list {
      max-height: 260px; overflow-y: auto;
      border-top: 1px solid var(--border);
      padding: 4px 0;
    }
    .problem-doc-row {
      display: flex; align-items: baseline; gap: 10px;
      padding: 5px 14px; font-size: 12px; line-height: 1.4;
    }
    .problem-doc-row:hover { background: var(--bg-2); }
    .problem-doc-name {
      flex: 0 0 auto; max-width: 55%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      font-weight: 500; color: var(--text);
    }
    .problem-doc-reason { flex: 1; color: var(--text-3); font-size: 12px; }
    .problem-doc-error .problem-doc-reason { color: #b45309; }
    .problem-doc-no_text .problem-doc-reason { color: var(--text-3); }

    .section-title {
      font-size: 12px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text);
      padding: 0 0 10px; border-bottom: 2px solid var(--accent);
      margin-bottom: 16px;
    }

    .project-entry { border-bottom: 1px solid var(--border); }
    .project-entry:last-child { border-bottom: none; }

    /* Verschachtelte Projekte (tiefer als eine Ebene unter einem Projektordner) */
    .nested-marker { color: var(--text-3); font-weight: 400; }
    .nested-rel {
      font-family: "SF Mono","Menlo","Consolas",monospace; font-size: 11px;
      color: var(--text-3);
    }

    /* Projekte ausserhalb aller konfigurierten Projektordner */
    .section-title.orphan-title { border-bottom-color: #e6a817; color: #92400e; }
    .orphan-hint {
      font-size: 12px; color: var(--text-2); line-height: 1.6;
      margin: -8px 0 14px; max-width: 640px;
    }
    .orphan-missing { color: #b45309; }
    .orphan-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
      padding: 10px 14px; border-radius: var(--radius); font-size: 13px;
      margin-bottom: 16px;
    }
    .orphan-banner a { color: #92400e; font-weight: 600; white-space: nowrap; }

    .project-row {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 0;
    }

    .project-toggle {
      width: 34px; height: 20px; border-radius: 10px;
      border: none; cursor: pointer; flex-shrink: 0;
      background: var(--border); transition: background .15s;
      position: relative;
    }
    .project-toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff; transition: left .15s;
    }
    .project-toggle.on { background: #374151; }
    .project-toggle.on::after { left: 17px; }

    .project-name  { font-weight: 600; font-size: 14px; color: var(--accent); }
    .project-meta  { font-size: 12px; color: var(--text-2); margin-top: 2px; }
    .project-path  { font-family: "SF Mono","Menlo","Consolas",monospace; font-size: 12px; color: var(--text-3); }
    .project-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .btn {
      padding: 5px 12px; font-size: 12px; font-family: inherit;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text); cursor: pointer;
    }
    .btn:hover { background: var(--bg-2); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: #374151; border-color: #374151; }
    .btn-danger  { color: #b91c1c; border-color: #fecaca; }
    .btn-danger:hover  { background: #fef2f2; }
    .btn-cancel  { color: var(--text-2); border-color: var(--border); font-size: 12px; padding: 3px 8px; }
    .btn-cancel:hover  { background: var(--bg-2); }

    .scan-badge { font-size: 12px; padding: 3px 8px; border-radius: 4px; }
    .scan-badge.running { background: #fef9c3; color: #92400e; }
    .scan-badge.done    { background: #dcfce7; color: #166534; }
    .scan-badge.warn    { background: #fef9c3; color: #92400e; }
    .scan-badge.error   { background: #fee2e2; color: #991b1b; }

    /* ── Scan-Fortschrittsbalken ── */
    .scan-progress-banner {
      border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .spb-running { background: #fffbeb; border-color: #fcd34d; }
    .spb-done    { background: #f0fdf4; border-color: #86efac; }
    .spb-error   { background: #fef2f2; border-color: #fca5a5; }
    .spb-header  { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .spb-icon    { font-size: 16px; flex-shrink: 0; }
    .spb-title   { font-size: 13px; font-weight: 600; color: var(--text-1);
                   flex: 1; min-width: 0; word-break: break-all; }
    .spb-phase   { font-size: 12px; color: var(--text-3); }
    .spb-bar-wrap {
      height: 8px; background: var(--bg-2); border-radius: 4px;
      overflow: hidden; margin-bottom: 6px;
    }
    .spb-running .spb-bar-fill { background: #f59e0b; }
    .spb-done    .spb-bar-fill { background: #22c55e; }
    .spb-error   .spb-bar-fill { background: #ef4444; }
    .spb-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
    .spb-counts  { font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
    .spb-current { font-size: 12px; color: var(--text-3); margin-bottom: 6px;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .spb-stats   { font-size: 12px; color: var(--text-3); margin-top: 4px; }

    /* ── Ordner-Browser ── */
    .browser-area {
      margin-top: 28px; border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .browser-header {
      padding: 10px 16px; background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      font-size: 13px; font-weight: 600; color: var(--text-2);
      display: flex; align-items: center; gap: 8px;
    }
    .browser-body {
      display: flex; min-height: 240px;
    }
    .browse-cols {
      display: flex; flex: 1; min-width: 0; overflow-x: auto;
    }
    .browse-col {
      min-width: 220px; width: 220px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto; max-height: 420px;
    }
    .browse-col:last-child { border-right: none; }
    .browse-entry {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px; font-size: 13px;
      width: 100%; color: var(--text);
    }
    .browse-check { flex-shrink: 0; cursor: pointer; width: 14px; height: 14px; }
    .browse-name  { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                    white-space: nowrap; cursor: pointer; text-align: left; }
    .browse-name:hover { color: #1d4ed8; }
    .browse-entry:hover { background: var(--bg-2); }
    .browse-entry.selected     { background: #eff6ff; color: #1d4ed8; }
    .browse-entry.multi-selected { background: #dbeafe; outline: 2px solid #93c5fd; outline-offset: -2px; }
    .browse-entry.ignored      { background: #fee2e2; color: #991b1b; }
    .browse-entry.excluded     { background: #fee2e2; color: #991b1b; }
    .browse-entry.browse-is-project  { background: #dcfce7; }
    .browse-entry.browse-has-subproject { background: #f0fdf4; }
    .browse-entry.browse-is-project:hover  { background: #bbf7d0; }
    .browse-entry.browse-has-subproject:hover { background: #dcfce7; }
    .browse-arrow { margin-left: auto; color: var(--text-3); font-size: 10px; }
    .browse-project-badge    { margin-left: auto; color: #16a34a; font-size: 12px; }
    .browse-subproject-badge { margin-left: auto; color: #86efac; font-size: 12px; }
    .browse-tag {
      font-size: 10px; padding: 1px 5px; border-radius: 3px;
      background: rgba(0,0,0,.08); color: inherit; white-space: nowrap;
    }

    .detail-panel {
      width: 260px; max-width: 260px; padding: 16px; border-left: 1px solid var(--border);
      flex-shrink: 0; background: var(--bg-2); overflow: hidden;
    }
    .detail-folder { font-weight: 700; font-size: 14px; margin-bottom: 12px; word-break: break-all; }
    .detail-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; }
    .detail-label { color: var(--text-3); }
    .detail-value { color: var(--text); font-weight: 500; }
    .detail-path  { font-family: "SF Mono","Menlo","Consolas",monospace; font-size: 10px; color: var(--text-3); margin-bottom: 12px; word-break: break-all; }
    .detail-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }

    /* ── Suchergebnis-Auswahl ── */
    .result-select { display: inline-flex; align-items: center; cursor: pointer; margin-right: 2px; }
    .result-select input { width: 14px; height: 14px; cursor: pointer; }
    .result.selected { background: #eff6ff; margin: 0 -16px; padding-left: 16px; padding-right: 16px; border-radius: 4px; }

    /* ── Ergebnis-Aktionen ── */
    .result-actions {
      display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
    }
    .btn-sm {
      padding: 3px 9px; font-size: 12px; font-family: inherit;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text-2); cursor: pointer;
    }
    .btn-sm:hover { background: var(--bg-2); color: var(--text); }

    /* ── Vorschau ── */
    .preview-toggle {
      background: none; border: none; cursor: pointer;
      color: var(--text-3); font-size: 12px; padding: 0 2px;
      font-family: inherit; flex-shrink: 0;
    }
    .preview-toggle:hover { color: var(--text); }
    .preview-box {
      margin-top: 10px; padding: 12px; background: var(--bg-2);
      border: 1px solid var(--border); border-radius: var(--radius);
    }
    .preview-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
    .preview-label { color: var(--text-3); font-size: 12px; }
    .preview-text { font-size: 13px; color: var(--text-2); line-height: 1.6; }

    /* ── Error ── */
    .search-error {
      font-size: 13px;
      color: #b91c1c;
      padding: 16px 0;
    }

    /* ── Kopfzeile: Modus-Umschalter + Projekt (siehe archivio-suchfilter-ui.md ──
       Beides in einer Zeile statt gestapelt, damit "Kontext oben" nicht selbst schon
       zwei Zeilen Höhe kostet. ── */
    .header-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding-top: 16px; flex-wrap: wrap;
    }
    /* Segmented Pill-Toggle (siehe Vorlage) statt Unterstrich-Tabs -- gleiche Form
       wie die uebrigen Segmented Controls, aktive Seite schwarz gefuellt. */
    .mode-switch {
      display: inline-flex; padding: 3px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--bg-2);
    }
    .mode-btn {
      font-size: 13px; font-weight: 600; font-family: inherit;
      padding: 6px 16px; border: none; border-radius: 999px;
      background: none; color: var(--text-2); cursor: pointer;
    }
    .mode-btn:hover { color: var(--text); }
    .mode-btn.active { color: #fff; background: #111; }
    .shared-filter-row { max-width: none; }

    /* ── Galerie / Foto-Browser ── */
    .gallery-group { margin: 22px 0; }
    .gallery-group-title {
      font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-3); padding-bottom: 8px; border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .gallery-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .photo-tile {
      position: relative; aspect-ratio: 1 / 1; border-radius: var(--radius);
      overflow: hidden; background: var(--bg-2); cursor: pointer;
      border: 2px solid transparent; outline: none;
    }
    .photo-tile.focused { border-color: var(--accent); }
    .photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-stars {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: center; gap: 1px;
      padding: 4px 0; background: linear-gradient(transparent, rgba(0,0,0,.55));
    }
    .photo-stars .star-tile-btn { border: 0; background: transparent; padding: 0; cursor: pointer; line-height: 0; }
    .photo-stars .star-tile-btn:hover .star, .photo-stars .star-tile-btn.filled:hover .star { color: #fbbf24; }

    .gallery-sentinel { height: 1px; }
    .ordner-tags-scroll {
      display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start;
      max-height: 132px; overflow-y: auto;
      padding: 2px 2px 4px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg);
    }
    .ordner-tags-scroll:empty { border: none; padding: 0; }
    .ordner-tags-scroll .scope-btn { flex-shrink: 0; }
    .hide-stars .photo-stars { display: none; }
    .hide-group-dividers .gallery-group-title { border-bottom: none; padding-bottom: 0; }

    .photo-select {
      position: absolute; top: 6px; left: 6px; z-index: 2;
      width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.4); border-radius: 4px; cursor: pointer; opacity: 0; transition: opacity .1s;
    }
    .photo-tile:hover .photo-select,
    .photo-tile.selected .photo-select { opacity: 1; }
    .photo-select input { width: 14px; height: 14px; cursor: pointer; }
    .photo-tile.selected { outline: 3px solid #2563eb; outline-offset: -3px; }

    .gallery-selection-bar {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #fff; padding: 10px 14px; border-radius: 8px;
      display: none; align-items: center; gap: 12px; z-index: 900;
      box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 13px;
    }
    .gallery-selection-bar .btn { font-size: 12px; }
    .gallery-selection-bar .btn,
    .gallery-selection-bar .btn-primary {
      background: #fff; color: var(--text); border-color: #fff;
    }
    .gallery-selection-bar .btn:hover,
    .gallery-selection-bar .btn-primary:hover { background: #e5e7eb; }

    .context-menu {
      position: fixed; z-index: 1100; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0,0,0,.18); padding: 4px; min-width: 170px;
      display: none;
    }
    .context-menu button {
      display: block; width: 100%; text-align: left; padding: 7px 12px; font-size: 13px;
      font-family: inherit; background: none; border: none; cursor: pointer; color: var(--text);
      border-radius: 4px;
    }
    .context-menu button:hover { background: var(--bg-2); }

    .tag-flyover {
      /* Oben links statt über der Bildmitte -- verdeckt sonst genau den Bildausschnitt,
         den man gerade taggen will (siehe Loupe: Bild ist zentriert, .loupe-close sitzt
         oben rechts, oben links bleibt frei). */
      position: fixed; top: 16px; left: 16px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,.25); padding: 10px; width: 320px; z-index: 1200;
    }
    .tag-flyover input {
      width: 100%; padding: 9px 12px; font-size: 14px; font-family: inherit;
      border: 1px solid var(--border); border-radius: 6px; outline: none;
      color: var(--text); background: var(--bg);
    }
    .tag-flyover input:focus { border-color: var(--accent); }
    .tag-flyover-suggestions { margin-top: 6px; max-height: 220px; overflow-y: auto; }
    .tag-flyover-item {
      padding: 7px 10px; font-size: 13px; cursor: pointer; border-radius: 4px; color: var(--text);
    }
    .tag-flyover-item:hover { background: var(--bg-2); }
    .tag-flyover-item.create { color: #2563eb; font-weight: 500; }
    .tag-flyover-item.highlighted { background: var(--accent); color: #fff; }
    .tag-flyover-pin {
      display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3);
      cursor: pointer; margin-bottom: 8px;
    }

    #tag-flyover-current:empty { margin: 0; }
    .tag-flyover-current-label {
      font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 5px;
    }
    .tag-flyover-current-chips { margin-bottom: 10px; }
    .tag-chip {
      display: inline-flex; align-items: center; gap: 3px;
      background: var(--bg-2); border: 1px solid var(--border); border-radius: 100px;
      padding: 3px 4px 3px 10px; font-size: 12px; margin: 0 5px 5px 0; color: var(--text);
    }
    .tag-chip-remove {
      background: none; border: none; cursor: pointer; color: var(--text-3);
      font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 50%;
    }
    .tag-chip-remove:hover { color: #dc2626; background: #fee2e2; }

    .tag-filter-item { position: relative; display: inline-block; }
    .tag-filter-item .scope-btn { padding-right: 38px; }
    .tag-filter-delete {
      position: absolute; top: 50%; right: 4px; transform: translateY(-50%);
      width: 14px; height: 14px; border-radius: 50%; background: #dc2626; color: #fff;
      border: none; font-size: 10px; line-height: 1; cursor: pointer; display: none;
      align-items: center; justify-content: center; padding: 0;
    }
    .tag-filter-rename {
      position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
      width: 14px; height: 14px; border-radius: 50%; background: var(--text-3); color: #fff;
      border: none; font-size: 10px; line-height: 1; cursor: pointer; display: none;
      align-items: center; justify-content: center; padding: 0;
    }
    .tag-filter-item:hover .tag-filter-delete,
    .tag-filter-item:hover .tag-filter-rename { display: flex; }

    .loupe-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.92);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
      flex-direction: column;
    }
    .loupe-img { max-width: 92vw; max-height: 78vh; object-fit: contain; }
    .loupe-close {
      position: absolute; top: 16px; right: 20px;
      background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;
    }
    .loupe-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.1); border: none; color: #fff;
      font-size: 28px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    }
    .loupe-nav:hover { background: rgba(255,255,255,.2); }
    .loupe-prev { left: 16px; }
    .loupe-next { right: 16px; }
    .loupe-footer {
      margin-top: 18px; display: flex; align-items: center; gap: 20px;
      color: #fff; font-size: 12px;
    }
    .loupe-stars .star { width: 22px; height: 22px; }
    .loupe-stars .star-tile-btn { border: 0; background: transparent; padding: 0; cursor: pointer; margin: 0 2px; line-height: 0; }
    .loupe-stars .star-tile-btn:hover .star { color: #fbbf24; }
    .loupe-auto { display: flex; align-items: center; gap: 6px; color: var(--text-3); cursor: pointer; }
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-inner">
      <a href="/" class="logo-wrap">
        <img src="/static/logo.svg" class="logo-icon" alt="">
        <span class="logo-text">Archivio</span>
      </a>
      <nav>
        <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Suche</a>
        <a href="/dashboard" class="{{ 'active' if request.url.path == '/dashboard' else '' }}">Dashboard</a>
        <a href="/dashboard/helper" class="{{ 'active' if request.url.path == '/dashboard/helper' else '' }}">Helper</a>
        <a href="/norms" class="{{ 'active' if request.url.path == '/norms' else '' }}">Normen</a>
        <a href="/dashboard/settings" class="{{ 'active' if request.url.path == '/dashboard/settings' else '' }}">Einstellungen</a>
        <span class="version-badge" id="nav-version"></span>
        <span id="nav-scan-status"
              hx-get="/api/scan/nav-status"
              hx-trigger="load, every 5s"
              hx-swap="innerHTML"></span>
      </nav>
      <script>
        fetch('/api/version').then(r=>r.json()).then(d=>{
          var el=document.getElementById('nav-version');
          if(el&&d.version) el.textContent='v'+d.version;
        });
      </script>
    </div>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer style="margin-top:60px;padding:20px 0;border-top:1px solid #e8e8e8;text-align:center;">
  <a href="mailto:info@bauchat.ch?subject=Archivio%20Feedback" style="display:inline-flex;align-items:center;gap:6px;background:var(--bg-2);color:var(--text-2);padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;text-decoration:none;border:1px solid var(--border);">Feedback senden</a>
</footer>

<script>
// ── Archivio Helper (localhost:44380) ─────────────────────────────────────────
// Öffnet Dateien lokal auf dem eigenen Mac — kein URL-Scheme, kein Dialog.
var HELPER = 'http://localhost:44380';

function _helperErrorMessage(status, path) {
  if (status === 404) {
    return 'Datei nicht gefunden auf diesem Mac:\n' + path
      + '\n\nMöglicherweise ist der Netzwerkpfad hier anders eingehängt als auf dem Server '
      + '(z.B. "/Volumes/Groups" vs. "/Volumes/Groups-1"). Verbindung zum NAS neu herstellen '
      + 'und erneut versuchen.';
  }
  return 'Archivio Helper konnte die Datei nicht öffnen (Fehler ' + status + ').';
}

function helperOpen(path) {
  fetch(HELPER + '/open?path=' + encodeURIComponent(path))
    .then(function(r) { if (!r.ok) alert(_helperErrorMessage(r.status, path)); })
    .catch(function() { alert('Archivio Helper läuft nicht. Bitte starten.'); });
}

function helperReveal(path) {
  fetch(HELPER + '/reveal?path=' + encodeURIComponent(path))
    .then(function(r) { if (!r.ok) alert(_helperErrorMessage(r.status, path)); })
    .catch(function() { alert('Archivio Helper läuft nicht. Bitte starten.'); });
}

function mergeSelectionToPdf(ids) {
  if (!ids || !ids.length) return;
  fetch('/api/pdf-zusammenfuehren', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids: ids }),
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (!d.ok) { alert('Fehler: ' + (d.error || 'unbekannt')); return; }
    var byteChars = atob(d.pdf_base64);
    var bytes = new Uint8Array(byteChars.length);
    for (var i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
    var blob = new Blob([bytes], { type: 'application/pdf' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Zusammengefuehrt.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if (d.skipped && d.skipped.length) {
      alert('Übersprungen (kein PDF oder nicht lesbar):\n' + d.skipped.join('\n'));
    }
  }).catch(function() { alert('Fehler beim Zusammenführen.'); });
}

function openMail(documentId) {
  fetch('/open/mail/' + documentId)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.ok) { alert('Fehler: ' + d.error); return; }
      // Versuch 1: Helper (läuft auf Client-Mac)
      fetch(HELPER + '/open?path=' + encodeURIComponent(d.url))
        .then(function(r) {
          if (!r.ok) throw new Error('helper-unavailable');
        })
        .catch(function() {
          // Versuch 2: Server-seitiges open (wenn Browser und Server auf derselben Maschine)
          fetch('/api/open/mail/' + documentId, { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(s) { if (!s.ok) alert('Fehler: ' + s.error); })
            .catch(function() { alert('Mail konnte nicht geöffnet werden.'); });
        });
    })
    .catch(function() { alert('Verbindungsfehler.'); });
}
