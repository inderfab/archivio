<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Archivio{% if office_name() %} – {{ office_name() }}{% endif %}{% endblock %}</title>
  <script src="/static/htmx.min.js" defer></script>
  <style>
    /* ── Reset & Basis ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text:    #1f2937;
      --text-2:  #6b7280;
      --text-3:  #9ca3af;
      --border:  #e5e7eb;
      --bg:      #ffffff;
      --bg-2:    #f9fafb;
      --accent:  #111827;
      --radius:  6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }

    /* ── Layout ── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0;
    }
    .header-inner {
      display: flex;
      align-items: center;
      gap: 32px;
      height: 52px;
    }
    .logo-text { font-size: 15px; font-weight: 600; color: var(--text-2); letter-spacing: -0.01em; }

    nav {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
    }
    nav a {
      font-size: 13px;
      color: var(--text-2);
      text-decoration: none;
      padding: 5px 10px;
      border-radius: var(--radius);
    }
    nav a:hover { color: var(--text); background: var(--bg-2); }
    nav a.active { color: var(--text); font-weight: 600; background: var(--bg-2); }

    /* ── Suchfeld ── */
    .search-wrap { padding: 48px 0 16px; }
    .search-input {
      width: 100%;
      padding: 14px 18px;
      font-size: 17px;
      font-family: inherit;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      color: var(--text);
      background: var(--bg);
      transition: border-color .15s, box-shadow .15s;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(17,24,39,.08);
    }
    .search-input::placeholder { color: var(--text-3); }

    /* ── Basis-Filter ── */
    .filters-basic {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 0 8px;
    }
    select, .filter-select {
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      outline: none;
      width: 100%;
    }
    select:hover { border-color: #9ca3af; }

    /* ── Mehr-Filter ── */
    .btn-mehr-filter {
      font-size: 13px; font-family: inherit;
      padding: 6px 14px; margin-bottom: 10px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text-2); cursor: pointer;
    }
    .btn-mehr-filter:hover { background: var(--bg-2); }
    .btn-mehr-filter.active { background: var(--bg-2); color: var(--text); border-color: #9ca3af; }
    .mehr-filter-panel {
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 10px; background: var(--bg-2);
    }
    .filter-section { margin-bottom: 16px; }
    .filter-section:last-child { margin-bottom: 0; }
    .filter-section-title {
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-3); margin-bottom: 10px;
    }
    .filter-row-2 {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 10px;
    }
    .filter-label {
      display: block; font-size: 10px; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 5px;
    }
    .filter-input {
      width: 100%; padding: 7px 10px; font-size: 13px; font-family: inherit;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text); outline: none;
    }
    .filter-input:focus { border-color: #9ca3af; }

    /* ── Filter-Chips ── */
    #active-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 0 12px; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px 3px 10px;
      background: #eff6ff; color: #1d4ed8;
      border: 1px solid #bfdbfe; border-radius: 100px; font-size: 12px;
    }
    .filter-chip button {
      background: none; border: none; cursor: pointer;
      color: #1d4ed8; font-size: 14px; line-height: 1; padding: 0;
    }

    /* ── Resultate ── */
    #results { min-height: 120px; }

    .result-count {
      font-size: 13px;
      color: var(--text-3);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .result {
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }
    .result:last-child { border-bottom: none; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .result-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }
    .result-title:hover { text-decoration: underline; color: #374151; }

    /* ── Badges ── */
    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .badge-pdf  { background: #fee2e2; color: #991b1b; }
    .badge-doc,
    .badge-docx { background: #dbeafe; color: #1e40af; }
    .badge-xlsx { background: #dcfce7; color: #166534; }
    .badge-eml  { background: #fef3c7; color: #92400e; }
    .badge-txt,
    .badge-rtf  { background: #f3f4f6; color: #374151; }
    /* CAD / BIM */
    .badge-dwg,
    .badge-dxf  { background: #ede9fe; color: #5b21b6; }
    .badge-pln  { background: #e0e7ff; color: #3730a3; }
    .badge-vwx  { background: #e0e7ff; color: #3730a3; }
    .badge-ifc  { background: #d1fae5; color: #065f46; }
    .badge-rvt  { background: #fce7f3; color: #9d174d; }
    .badge-skp,
    .badge-3dm,
    .badge-nwd  { background: #f3f4f6; color: #374151; }
    /* Medien / Sonstiges */
    .badge-psd,
    .badge-ai,
    .badge-indd { background: #fef3c7; color: #78350f; }
    .badge-mp4,
    .badge-mov  { background: #f3f4f6; color: #6b7280; }
    .badge-zip  { background: #f3f4f6; color: #6b7280; }
    .badge-page { background: #e0f2fe; color: #075985; font-variant-numeric: tabular-nums; }

    .no-content-hint {
      font-size: 12px;
      color: var(--text-3);
      font-style: italic;
    }

    /* ── Meta & Pfad ── */
    .result-meta {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 5px;
    }
    .result-path {
      font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
      font-size: 11px;
      color: var(--text-3);
      margin-bottom: 7px;
      word-break: break-all;
    }

    /* ── Textausschnitt ── */
    .result-excerpt {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.55;
    }
    mark {
      background: #fef9c3;
      color: var(--text);
      border-radius: 2px;
      padding: 0 1px;
    }

    /* ── Leer-Zustand ── */
    .empty-state {
      padding: 72px 0;
      text-align: center;
      color: var(--text-3);
    }
    .empty-state p { font-size: 15px; }

    /* ── HTMX Indicator ── */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .spinner {
      font-size: 13px;
      color: var(--text-3);
      padding: 24px 0;
      display: none;
    }

    /* ── Dashboard ── */
    .stats-bar {
      display: flex;
      gap: 40px;
      padding: 28px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .stat-n { display: block; font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1.1; }
    .stat-l { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px; }

    .section-title {
      font-size: 12px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text);
      padding: 0 0 10px; border-bottom: 2px solid var(--accent);
      margin-bottom: 16px;
    }

    .project-entry { border-bottom: 1px solid var(--border); }
    .project-entry:last-child { border-bottom: none; }

    .project-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .project-row:last-child { border-bottom: none; }

    .project-toggle {
      width: 34px; height: 20px; border-radius: 10px;
      border: none; cursor: pointer; flex-shrink: 0;
      background: var(--border); transition: background .15s;
      position: relative;
    }
    .project-toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff; transition: left .15s;
    }
    .project-toggle.on { background: #374151; }
    .project-toggle.on::after { left: 17px; }

    .project-name  { font-weight: 600; font-size: 14px; color: var(--accent); }
    .project-meta  { font-size: 12px; color: var(--text-2); margin-top: 2px; }
    .project-path  { font-family: "SF Mono","Menlo","Consolas",monospace; font-size: 11px; color: var(--text-3); }
    .project-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .btn {
      padding: 5px 12px; font-size: 12px; font-family: inherit;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text); cursor: pointer;
    }
    .btn:hover { background: var(--bg-2); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: #374151; border-color: #374151; }
    .btn-danger  { color: #b91c1c; border-color: #fecaca; }
    .btn-danger:hover  { background: #fef2f2; }

    .scan-badge { font-size: 12px; padding: 3px 8px; border-radius: 4px; }
    .scan-badge.running { background: #fef9c3; color: #92400e; }
    .scan-badge.done    { background: #dcfce7; color: #166534; }
    .scan-badge.error   { background: #fee2e2; color: #991b1b; }

    /* ── Ordner-Browser ── */
    .browser-area {
      margin-top: 28px; border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .browser-header {
      padding: 10px 16px; background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      font-size: 13px; font-weight: 600; color: var(--text-2);
      display: flex; align-items: center; gap: 8px;
    }
    .browser-body {
      display: flex; min-height: 240px;
    }
    .browse-cols {
      display: flex; flex: 1; min-width: 0; overflow-x: auto;
    }
    .browse-col {
      min-width: 220px; width: 220px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto; max-height: 420px;
    }
    .browse-col:last-child { border-right: none; }
    .browse-entry {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px; font-size: 13px; cursor: pointer;
      border: none; background: none; width: 100%; text-align: left;
      color: var(--text); font-family: inherit;
    }
    .browse-entry:hover { background: var(--bg-2); }
    .browse-entry.selected { background: #eff6ff; color: #1d4ed8; }
    .browse-entry.ignored  { background: #fee2e2; color: #991b1b; }
    .browse-arrow { margin-left: auto; color: var(--text-3); font-size: 10px; }
    .browse-ignored-badge {
      font-size: 10px; padding: 1px 5px; border-radius: 3px;
      background: #f3f4f6; color: var(--text-3);
    }

    .detail-panel {
      width: 260px; max-width: 260px; padding: 16px; border-left: 1px solid var(--border);
      flex-shrink: 0; background: var(--bg-2); overflow: hidden;
    }
    .detail-folder { font-weight: 700; font-size: 14px; margin-bottom: 12px; word-break: break-all; }
    .detail-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; }
    .detail-label { color: var(--text-3); }
    .detail-value { color: var(--text); font-weight: 500; }
    .detail-path  { font-family: "SF Mono","Menlo","Consolas",monospace; font-size: 10px; color: var(--text-3); margin-bottom: 12px; word-break: break-all; }
    .detail-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }

    /* ── Ergebnis-Aktionen ── */
    .result-actions {
      display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
    }
    .btn-sm {
      padding: 3px 9px; font-size: 11px; font-family: inherit;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text-2); cursor: pointer;
    }
    .btn-sm:hover { background: var(--bg-2); color: var(--text); }

    /* ── Vorschau ── */
    .preview-toggle {
      background: none; border: none; cursor: pointer;
      color: var(--text-3); font-size: 11px; padding: 0 2px;
      font-family: inherit; flex-shrink: 0;
    }
    .preview-toggle:hover { color: var(--text); }
    .preview-box {
      margin-top: 10px; padding: 12px; background: var(--bg-2);
      border: 1px solid var(--border); border-radius: var(--radius);
    }
    .preview-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
    .preview-label { color: var(--text-3); font-size: 11px; }
    .preview-text { font-size: 13px; color: var(--text-2); line-height: 1.6; }

    /* ── Error ── */
    .search-error {
      font-size: 13px;
      color: #b91c1c;
      padding: 16px 0;
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-inner">
      <span class="logo-text">Archivio</span>
      <nav>
        <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Suche</a>
        <a href="/dashboard" class="{{ 'active' if request.url.path == '/dashboard' else '' }}">Dashboard</a>
        <a href="/dashboard/settings" class="{{ 'active' if request.url.path == '/dashboard/settings' else '' }}">Einstellungen</a>
      </nav>
    </div>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

</body>
</html>
