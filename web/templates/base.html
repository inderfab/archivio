<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Archivio{% endblock %}</title>
  <script src="/static/htmx.min.js" defer></script>
  <style>
    /* ── Reset & Basis ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text:    #1f2937;
      --text-2:  #6b7280;
      --text-3:  #9ca3af;
      --border:  #e5e7eb;
      --bg:      #ffffff;
      --bg-2:    #f9fafb;
      --accent:  #111827;
      --radius:  6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }

    /* ── Layout ── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0;
    }
    .header-inner {
      display: flex;
      align-items: center;
      gap: 32px;
      height: 52px;
    }
    .logo {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
      text-decoration: none;
    }
    nav a {
      font-size: 14px;
      color: var(--text-2);
      text-decoration: none;
      padding: 4px 0;
    }
    nav a:hover { color: var(--text); }

    /* ── Suchfeld ── */
    .search-wrap { padding: 48px 0 16px; }
    .search-input {
      width: 100%;
      padding: 13px 16px;
      font-size: 16px;
      font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      color: var(--text);
      background: var(--bg);
      transition: border-color .15s;
    }
    .search-input:focus { border-color: #9ca3af; }
    .search-input::placeholder { color: var(--text-3); }

    /* ── Filter-Leiste ── */
    .filters {
      display: flex;
      gap: 8px;
      padding: 10px 0 24px;
      flex-wrap: wrap;
    }
    select, .filter-select {
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }
    select:hover { border-color: #9ca3af; }

    /* ── Resultate ── */
    #results { min-height: 120px; }

    .result-count {
      font-size: 13px;
      color: var(--text-3);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .result {
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }
    .result:last-child { border-bottom: none; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .result-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }
    .result-title:hover { text-decoration: underline; color: #374151; }

    /* ── Badges ── */
    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .badge-pdf  { background: #fee2e2; color: #991b1b; }
    .badge-doc,
    .badge-docx { background: #dbeafe; color: #1e40af; }
    .badge-xlsx { background: #dcfce7; color: #166534; }
    .badge-eml  { background: #fef3c7; color: #92400e; }
    .badge-txt,
    .badge-rtf  { background: #f3f4f6; color: #374151; }
    /* CAD / BIM */
    .badge-dwg,
    .badge-dxf  { background: #ede9fe; color: #5b21b6; }
    .badge-pln  { background: #e0e7ff; color: #3730a3; }
    .badge-vwx  { background: #e0e7ff; color: #3730a3; }
    .badge-ifc  { background: #d1fae5; color: #065f46; }
    .badge-rvt  { background: #fce7f3; color: #9d174d; }
    .badge-skp,
    .badge-3dm,
    .badge-nwd  { background: #f3f4f6; color: #374151; }
    /* Medien / Sonstiges */
    .badge-psd,
    .badge-ai,
    .badge-indd { background: #fef3c7; color: #78350f; }
    .badge-mp4,
    .badge-mov  { background: #f3f4f6; color: #6b7280; }
    .badge-zip  { background: #f3f4f6; color: #6b7280; }

    .no-content-hint {
      font-size: 12px;
      color: var(--text-3);
      font-style: italic;
    }

    /* ── Meta & Pfad ── */
    .result-meta {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 5px;
    }
    .result-path {
      font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
      font-size: 11px;
      color: var(--text-3);
      margin-bottom: 7px;
      word-break: break-all;
    }

    /* ── Textausschnitt ── */
    .result-excerpt {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.55;
    }
    mark {
      background: #fef9c3;
      color: var(--text);
      border-radius: 2px;
      padding: 0 1px;
    }

    /* ── Leer-Zustand ── */
    .empty-state {
      padding: 72px 0;
      text-align: center;
      color: var(--text-3);
    }
    .empty-state p { font-size: 15px; }

    /* ── HTMX Indicator ── */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .spinner {
      font-size: 13px;
      color: var(--text-3);
      padding: 24px 0;
      display: none;
    }

    /* ── Error ── */
    .search-error {
      font-size: 13px;
      color: #b91c1c;
      padding: 16px 0;
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-inner">
      <a class="logo" href="/">Archivio</a>
      <nav>
        <a href="/projects">Projekte</a>
      </nav>
    </div>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

</body>
</html>
