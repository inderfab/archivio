<div class="browse-col" data-depth="{{ depth }}">
  {% if error_msg %}
    <div style="padding:12px; font-size:12px; color:#c0392b;">⚠ {{ error_msg }}</div>
  {% elif subdirs %}
    {% for d in subdirs %}
    <button
      class="browse-entry {{ 'ignored' if d.ignored else '' }} {{ 'excluded' if d.excluded and not d.ignored else '' }} {{ 'browse-is-project' if d.is_project else 'browse-has-subproject' if d.has_subproject else '' }}"
      data-path="{{ d.path }}"
      data-excluded="{{ 'true' if d.excluded else 'false' }}"
      data-has-children="{{ 'true' if d.has_children else 'false' }}"
      onclick="
        clearFromDepth({{ project_id }}, {{ depth + 1 }});
        selectEntry(this, {{ project_id }}, '{{ d.path | replace("'", "\\'") | replace('\\', '\\\\') }}');
        {% if d.has_children %}
        htmx.ajax('GET',
          '/dashboard/browse?path={{ d.path | urlencode }}&project_id={{ project_id }}&depth={{ depth + 1 }}',
          { target: '#browse-cols-{{ project_id }}', swap: 'beforeend' }
        );
        {% endif %}
      "
    >
      <span style="flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
        {{ d.name }}
      </span>
      {% if d.ignored %}
        <span class="browse-tag">ignoriert</span>
      {% elif d.excluded %}
        <span class="browse-tag">ausgeschlossen</span>
      {% elif d.is_project %}
        <span class="browse-project-badge">◆</span>
      {% elif d.has_subproject %}
        <span class="browse-subproject-badge">◈</span>
      {% elif d.has_children %}
        <span class="browse-arrow">▶</span>
      {% endif %}
    </button>
    {% endfor %}
  {% else %}
    <div style="padding:12px; font-size:12px; color:var(--text-3);">Keine Unterordner</div>
  {% endif %}

</div>
