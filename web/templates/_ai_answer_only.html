{% if answer %}
<div class="ai-answer-block" style="margin-bottom:20px;">
  <div class="ai-answer-header">
    <span class="ai-label">KI-Antwort <span style="font-size:11px;font-weight:400;opacity:.6;">(experimentell)</span></span>
    <span class="ai-model">llama3.2</span>
  </div>
  <div class="ai-answer-text">{{ answer }}</div>
</div>
{% else %}
<div style="color:var(--text-3); font-size:13px; margin-bottom:8px;">Keine Antwort generiert.</div>
{% endif %}
