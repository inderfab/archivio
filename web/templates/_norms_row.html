{% from "_icons.html" import icon_refresh, icon_folder %}
{% macro norm_row(d, id_prefix='') %}
<div class="norm-list-row" id="{{ id_prefix }}norm-row-{{ d.id }}">
  <span class="norm-chip" title="{{ d.filename }}">{{ (d.type ~ ' ' ~ d.number) if d.number else d.filename }}</span>
  <span class="norm-meta" style="display:inline-flex; align-items:center; gap:5px;"
        title="{{ d.check_label }}{% if d.checked_at %} · zuletzt geprüft: {{ d.checked_at }}{% endif %}">
    <span class="status-dot {{ 'ok' if d.check_status == 'aktuell' else ('bad' if d.check_status == 'veraltet' else 'neutral') }}"></span>
    {{ d.valid_from[:4] if d.valid_from else '' }}
  </span>
  <button type="button" class="norm-icon-btn" title="Aktualität jetzt prüfen"
          hx-post="/norms/check/{{ d.id }}" hx-target="#{{ id_prefix }}norm-row-{{ d.id }}" hx-swap="outerHTML"
          hx-indicator="#{{ id_prefix }}norm-check-spin-{{ d.id }}">
    <span id="{{ id_prefix }}norm-check-spin-{{ d.id }}">{{ icon_refresh() }}</span>
  </button>
  <button type="button" class="norm-icon-btn" title="Im Finder zeigen" data-path="{{ d.path }}"
          onclick="helperReveal(this.dataset.path)">{{ icon_folder() }}</button>
  <button type="button" class="norm-icon-btn norm-unmark-btn" title="Fälschlich als Norm erkannt -- aus der Liste entfernen"
          hx-post="/norms/unmark/{{ d.id }}" hx-target="#{{ id_prefix }}norm-row-{{ d.id }}" hx-swap="outerHTML"
          hx-confirm="„{{ d.filename }}“ wirklich dauerhaft als „keine Norm“ markieren?">✕</button>
</div>
{% endmacro %}
{% if d is defined %}{{ norm_row(d) }}{% endif %}
