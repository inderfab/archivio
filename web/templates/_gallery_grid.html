{% for group in groups %}
<div class="gallery-group">
  <div class="gallery-group-title">{{ group.name }}</div>
  <div class="gallery-grid">
    {% for p in group.photos %}
    <div class="photo-tile" data-id="{{ p.id }}" data-rating="{{ p.rating or 0 }}" data-path="{{ p.path }}"
         tabindex="0" title="{{ p.filename }}"
         onclick="openLoupe({{ p.id }})" onfocus="focusTile({{ p.id }})">
      <img src="/foto/{{ p.id }}/thumb?size=grid" loading="lazy" alt="{{ p.filename }}">
      <label class="photo-select" onclick="event.stopPropagation()" title="Für Kontaktbogen auswählen">
        <input type="checkbox" onclick="toggleSelect({{ p.id }}, event)">
      </label>
      <div class="photo-stars" onclick="event.stopPropagation()">
        {% for i in range(1, 6) %}
        <span class="star {{ 'filled' if i <= (p.rating or 0) else '' }}"
              onclick="ratePhoto({{ p.id }}, {{ i }}, event)">★</span>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endfor %}
{% if has_more %}
<div class="gallery-sentinel"
     hx-get="/galerie?project_id={{ project_id|urlencode }}&sterne={{ sterne|urlencode }}&offset={{ next_offset }}&date_from={{ date_from|urlencode }}&date_to={{ date_to|urlencode }}&formate={{ formate|urlencode }}&ordner={{ ordner|urlencode }}&tag_id={{ tag_id|urlencode }}&show_large_tiff={{ show_large_tiff|urlencode }}"
     hx-trigger="revealed" hx-swap="outerHTML"></div>
{% endif %}
{% if is_empty %}
<div class="empty-state"><p>Keine Fotos gefunden.</p></div>
{% endif %}
