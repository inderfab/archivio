{% from "_norms_row.html" import norm_row %}
{% for d in docs %}
{{ norm_row(d) }}
{% endfor %}
{% if has_more %}
<div class="norms-sentinel" hx-get="/norms/list?bucket={{ bucket }}&offset={{ next_offset }}"
     hx-trigger="intersect root:#norms-list-box-{{ bucket or 'all' }} threshold:0" hx-swap="outerHTML"></div>
{% endif %}
{% if is_empty %}
<p class="norm-empty">Keine Normen gefunden.</p>
{% endif %}
