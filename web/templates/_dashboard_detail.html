<div class="detail-folder">{{ folder_name }}</div>
<div class="detail-path">{{ path }}</div>

<div class="detail-row">
  <span class="detail-label">Dateien (direkt)</span>
  <span class="detail-value">{{ file_count }}</span>
</div>
<div class="detail-row">
  <span class="detail-label">Indexiert (inkl. Unterordner)</span>
  <span class="detail-value">{{ indexed_count }}</span>
</div>
<div class="detail-row">
  <span class="detail-label">Status</span>
  <span class="detail-value">
    {% if is_ignored %}
      <span class="browse-ignored-badge" style="font-size:11px;">ignoriert</span>
    {% else %}
      aktiv
    {% endif %}
  </span>
</div>

<div class="detail-actions">
  {% if is_ignored %}
    <form hx-post="/dashboard/unignore" hx-target="closest .detail-panel" hx-swap="innerHTML">
      <input type="hidden" name="path"       value="{{ path }}">
      <input type="hidden" name="project_id" value="{{ project_id }}">
      <button type="submit" class="btn" style="width:100%;">Ignorierung aufheben</button>
    </form>
  {% else %}
    <form hx-post="/dashboard/ignore" hx-target="closest .detail-panel" hx-swap="innerHTML">
      <input type="hidden" name="path"       value="{{ path }}">
      <input type="hidden" name="project_id" value="{{ project_id }}">
      <button type="submit" class="btn btn-danger" style="width:100%;">Ignorieren</button>
    </form>
  {% endif %}
</div>
